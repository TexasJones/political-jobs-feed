name: Weekly Jobs Feed

on:
  schedule:
    - cron: "0 8 * * MON"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape jobs
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scraper.py

      - name: Generate pages
        run: python generate_pages.py

      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.xml docs/
          git diff --staged --quiet || git commit -m "Weekly update: jobs feed + pages"
          git push
