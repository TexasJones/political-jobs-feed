name: Daily Jobs Feed
on:
  schedule:
    # Was weekly (0 8 * * MON) -- bumped to daily at 08:00 UTC so feed.xml
    # is fresh every day before Polly Brief runs at noon UTC (see
    # Polly-brief/.github/workflows/*.yml). A weekly-refreshed feed feeding
    # a daily "New Today" stat meant that stat was 0 on every day except
    # the one right after Monday's scrape -- this closes that gap.
    - cron: "0 8 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scrape jobs
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scraper.py
      - name: Push feed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Daily update: jobs feed"
          git push
